{% extends "base.html" %}
{% block title %}固件版本 - RGV OTA{% endblock %}
{% block heading %}固件版本管理{% endblock %}
{% block subheading %}固件管理与上传{% endblock %}
{% block content %}
<section class="grid">
  <form id="upload-form" class="card panel-card">
    <h2>
      <i class="bi bi-cloud-upload-fill panel-header-icon"></i>
      <span>上传新固件</span>
    </h2>
    <div class="form-grid">
      <div class="form-group">
        <label>固件文件 (.bin)</label>
        <div class="file-input-wrapper">
          <input type="file" name="file" accept=".bin" required>
        </div>
      </div>
      <div class="form-group">
        <label>版本号 (选填)</label>
        <input name="version" placeholder="留空自动解析">
      </div>
      <div class="form-group wide">
        <label>更新描述</label>
        <input name="description" placeholder="说明改动内容（选填）">
      </div>
      <div class="form-group wide">
        <label>详细说明 (选填)</label>
        <textarea name="release_notes" rows="3" placeholder="填写变更细节"></textarea>
      </div>
    </div>
    <button class="primary btn-glow" type="submit" style="margin-top: 12px;">上传固件</button>
  </form>
</section>

<section class="card panel-card">
  <h2>
    <i class="bi bi-file-earmark-binary-fill panel-header-icon"></i>
    <span>历史固件列表</span>
  </h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width: 60px;">ID</th>
          <th style="width: 140px;">版本</th>
          <th>原文件名 / 说明</th>
          <th style="width: 100px;">文件大小</th>
          <th style="width: 150px;">SHA256</th>
          <th>固件下载 URL</th>
          <th style="width: 160px; text-align: center;">操作</th>
        </tr>
      </thead>
      <tbody id="firmware-table"></tbody>
    </table>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/firmware.js"></script>{% endblock %}
